services:
  web:
    build: .
    restart: unless-stopped
    environment:
      PORT: "3000"
      DATA_DIR: /data
      TRUST_PROXY: ${TRUST_PROXY:-1}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      SESSION_SECRET: ${SESSION_SECRET:-}
      # Payments (optional). Leave empty to run with offline payment methods.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_AUTOMATIC_TAX: ${STRIPE_AUTOMATIC_TAX:-0}
      # Helcim card payments (CAD/USD) — alternative or addition to Stripe.
      HELCIM_API_TOKEN: ${HELCIM_API_TOKEN:-}
      HELCIM_WEBHOOK_VERIFIER: ${HELCIM_WEBHOOK_VERIFIER:-}
      HELCIM_API_URL: ${HELCIM_API_URL:-}
      # Email (optional). Without a key, messages are logged and skipped.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      PAYMENTS_DEMO: ${PAYMENTS_DEMO:-0}
    volumes:
      - shop-data:/data
    ports:
      - "${PORT:-3000}:3000"

volumes:
  shop-data:
